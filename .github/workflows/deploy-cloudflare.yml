name: Deploy to Cloudflare

# Go-live plan step 2 (docs/planning/2026-07-25-golive-hosting-billing-plan.md).
#
# This deploys the SAME staged www/ as deploy-pages.yml, to a second host. Both
# run on every push to main and both stay live during the migration window —
# github.io keeps serving existing users (whose nbhsk.* localStorage and
# anonymous Supabase sessions are tied to that origin) until the migration
# bridge has moved them. Do not delete deploy-pages.yml until plan step 9.
#
# Target is Cloudflare WORKERS STATIC ASSETS, not Pages — see wrangler.jsonc for
# why. Config (project name, assets directory) lives there, so this workflow is
# just the gate plus `wrangler deploy`.
#
# Deliberately NOT using Cloudflare's Git build integration: that builds on
# Cloudflare's runners and would bypass `npm test`. Deploying from Actions keeps
# the full suite in front of every production deploy — the same gate
# deploy-pages.yml enforces.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Stage www
        run: node scripts/stage-www.js

      # Cloudflare caps a deployment at 20,000 files on the Workers free plan
      # (100,000 on Workers Paid). www/ was 14,068 at v135 and audio is the growth
      # axis (13,949 of those are mp3s), so fail loudly with headroom rather than
      # discovering the cap mid-deploy. If this trips, the answer is either the
      # Workers Paid upgrade (5x the ceiling) or the deferred R2 move for audio/.
      - name: Guard the static-asset file cap
        run: |
          count=$(find www -type f | wc -l)
          echo "www/ contains $count files (Workers free plan limit: 20000; paid: 100000)"
          if [ "$count" -ge 20000 ]; then
            echo "::error::www/ has $count files, at or over the 20,000-file free-plan limit — deploy will be rejected. Upgrade to Workers Paid or move audio/ to R2."
            exit 1
          fi
          if [ "$count" -ge 18000 ]; then
            echo "::warning::www/ has $count files, within 2,000 of the free-plan limit — plan the Workers Paid upgrade or the R2 migration for audio/."
          fi

      # wrangler major pinned on purpose (4.x current as of 2026-07-30). Bump it
      # as a deliberate change, not implicitly via @latest.
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
